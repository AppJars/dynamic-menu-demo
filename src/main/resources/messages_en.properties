# Application shell
appjars.dynamicmenu.demo.layout.drawertitle=Dynamic Menu Demo
appjars.dynamicmenu.demo.layout.menutoggle=Show or hide the menu
appjars.dynamicmenu.demo.layout.signin=Sign in to see more
appjars.dynamicmenu.demo.layout.switchuser=Switch user
appjars.dynamicmenu.demo.layout.signout=Sign out
appjars.dynamicmenu.demo.menuitem.home=Home

# Landing page
appjars.dynamicmenu.demo.home.title=Dynamic Menu Demo
appjars.dynamicmenu.demo.home.hero.title=Dynamic Menu
appjars.dynamicmenu.demo.home.hero.tagline=A multi-level application menu that your users edit at \
  runtime, stored in your own database and rendered into any Vaadin layout. The menu you see on the \
  left is built from that data, and you can change it right now without touching a single line of code.

appjars.dynamicmenu.demo.home.features.title=What''s inside
appjars.dynamicmenu.demo.home.features.multilevel.title=Multi-level menu
appjars.dynamicmenu.demo.home.features.multilevel.desc=Menu entries live in your datastore and nest \
  as deep as you need. The appjar hands them to your layout as ready-to-use navigation items.
appjars.dynamicmenu.demo.home.features.editor.title=Built-in editor
appjars.dynamicmenu.demo.home.features.editor.desc=A complete administration screen to create, edit, \
  delete and reorder entries by dragging them, with no extra work on your side.
appjars.dynamicmenu.demo.home.features.permissions.title=Visibility by role
appjars.dynamicmenu.demo.home.features.permissions.desc=Each entry can require, accept or reject \
  security roles, or simply follow the access rules already declared on your routes.
appjars.dynamicmenu.demo.home.features.icons.title=Pluggable icon sets
appjars.dynamicmenu.demo.home.features.icons.desc=The appjar comes with Vaadin Icons and lets your \
  application register any other icon family, which then becomes selectable in the editor. This \
  demo registers FontAwesome and a hand-made icon set to show how.
appjars.dynamicmenu.demo.home.features.routes.title=Internal routes and links
appjars.dynamicmenu.demo.home.features.routes.desc=Point an entry at one of your application routes, \
  fill in its URL parameters, or send users to an external address.
appjars.dynamicmenu.demo.home.features.importexport.title=Import and export
appjars.dynamicmenu.demo.home.features.importexport.desc=Move a menu between environments as JSON, \
  with a preview of what changes and four strategies to merge it into the existing one.
appjars.dynamicmenu.demo.home.features.i18n.title=Translated labels
appjars.dynamicmenu.demo.home.features.i18n.desc=Mark an entry as internationalized and its label \
  and tooltip are resolved through your own translation files.

appjars.dynamicmenu.demo.home.tryit.title=Try it now
appjars.dynamicmenu.demo.home.tryit.intro=The menu on the left was created on the first start of \
  this demo, and it is already filtered for whoever is signed in: a visitor who is not sees only \
  the entries with no restrictions. Switch between the sample accounts and the same stored menu \
  renders differently — that is the appjar doing its job. Signing in is also what opens the editor, \
  which is an administration screen. Once you edit the menu, use Refresh in the editor (or reload \
  the page) to see the drawer change: it is built once per page load.
appjars.dynamicmenu.demo.home.tryit.editor=Open the menu editor

appjars.dynamicmenu.demo.home.accounts.admin=sees everything, including the entry that requires the \
  ADMIN role
appjars.dynamicmenu.demo.home.accounts.manager=sees the editor, but not the entry reserved for \
  administrators
appjars.dynamicmenu.demo.home.accounts.user=sees the editor and nothing else beyond the public entry
appjars.dynamicmenu.demo.home.accounts.note=The password is the account name, and you never type \
  it: the sign-in screen is a list to pick from.

appjars.dynamicmenu.demo.home.shipswith.title=What this demo ships with
appjars.dynamicmenu.demo.home.shipswith.accounts=Three in-memory accounts — admin, manager and \
  user — one per role this application declares, so the role rules of an entry can be tried out.
appjars.dynamicmenu.demo.home.shipswith.views=Three views to point entries at: a dashboard open to \
  any signed-in user, a reports view restricted to managers and administrators (and taking a URL \
  parameter), and an audit log restricted to administrators.
appjars.dynamicmenu.demo.home.shipswith.icons=Vaadin Icons, three FontAwesome families and a \
  hand-made icon set, all registered by this demo, to show how an application contributes its own.
appjars.dynamicmenu.demo.home.shipswith.menu=A sample menu of four entries, each one demonstrating \
  a different way of deciding who sees it — read their tooltips in the editor.
appjars.dynamicmenu.demo.home.shipswith.exercise=One free slot under the five-item limit: create an \
  entry pointing at the reports view, give it the MANAGER and ADMIN roles as sufficient, and watch \
  it appear and disappear as you switch accounts.

appjars.dynamicmenu.demo.home.tour.button=Guided tour
appjars.dynamicmenu.demo.home.tour.thispage=This page
appjars.dynamicmenu.demo.home.tour.menu=The application menu
appjars.dynamicmenu.demo.home.tour.editor=The menu editor
appjars.dynamicmenu.demo.home.tour.itemdialog=Editing a menu item
appjars.dynamicmenu.demo.home.tour.itempermissions=Permissions of a menu item
appjars.dynamicmenu.demo.home.tour.unavailable=The greyed-out tours visit the menu editor, which you \
  are not allowed to open. Sign in, or switch to an account that can, to take them.
appjars.dynamicmenu.demo.home.tour.unavailable.hint=Greyed out? Switch user to take those tours

appjars.dynamicmenu.demo.home.license.title=Free vs. full license
appjars.dynamicmenu.demo.home.license.desc=This demo runs in free mode: every feature is fully \
  functional, limited to 5 menu items in total. A full license removes the limit — nothing else \
  changes.
appjars.dynamicmenu.demo.home.license.link=Get a license at appjars.com

appjars.dynamicmenu.demo.home.links.title=Learn more
appjars.dynamicmenu.demo.home.links.github=AppJars on GitHub
appjars.dynamicmenu.demo.home.links.docs=AppJars documentation

# Sign in
appjars.dynamicmenu.demo.login.title=Pick an account
appjars.dynamicmenu.demo.login.intro=Every account has a different role, and the menu on the left is \
  built from the roles of whoever is signed in. Choose one and watch the drawer change.
appjars.dynamicmenu.demo.login.account=Sign in as
appjars.dynamicmenu.demo.login.submit=Sign in
appjars.dynamicmenu.demo.login.passwords=These are in-memory accounts of the demo, with the password \
  equal to the account name. Nothing to type: the list above submits them for you.
appjars.dynamicmenu.demo.login.sees.admin=Sees every entry of the sample menu
appjars.dynamicmenu.demo.login.sees.manager=Sees the editor, not the administrators'' entry
appjars.dynamicmenu.demo.login.sees.user=Sees the editor and the public entry

# The views a menu entry can point at
appjars.dynamicmenu.demo.target.facts=How the menu treats this view
appjars.dynamicmenu.demo.target.route=Route
appjars.dynamicmenu.demo.target.access=Access annotation
appjars.dynamicmenu.demo.target.audience=Who can open it
appjars.dynamicmenu.demo.target.dashboard.title=Dashboard
appjars.dynamicmenu.demo.target.dashboard.desc=A view with nothing in it: it exists so a menu entry \
  can point at a real route of the application. Because it only asks for an authenticated user, an \
  entry flagged as "only render if allowed" appears here for everybody who signs in.
appjars.dynamicmenu.demo.target.dashboard.audience=Any signed-in user
appjars.dynamicmenu.demo.target.reports.title=Reports
appjars.dynamicmenu.demo.target.reports.desc=The view with a route parameter. Point a menu entry at \
  it and the editor asks for a value for the parameter, which it then builds into the link. Its own \
  access rules also make it a good target for an entry flagged as "only render if allowed".
appjars.dynamicmenu.demo.target.reports.audience=Managers and administrators
appjars.dynamicmenu.demo.target.reports.period=Reporting period taken from the URL: {0}
appjars.dynamicmenu.demo.target.reports.noperiod=No reporting period in the URL. A menu entry \
  pointing here can fill one in.
appjars.dynamicmenu.demo.target.audit.title=Audit log
appjars.dynamicmenu.demo.target.audit.desc=Restricted to administrators. The sample menu has an \
  entry for it that requires the ADMIN role, so the entry and the view agree — but they are checked \
  separately: the entry''s own roles decide whether it is rendered, the annotation below decides \
  whether the view opens.
appjars.dynamicmenu.demo.target.audit.audience=Administrators only

# Guided tours
appjars.dynamicmenu.demo.tour.btn.next=Next
appjars.dynamicmenu.demo.tour.btn.back=Back
appjars.dynamicmenu.demo.tour.btn.done=Done

appjars.dynamicmenu.demo.tour.menu.intro.title=The menu on the left
appjars.dynamicmenu.demo.tour.menu.intro.desc=The drawer is a plain Vaadin layout. Everything you \
  see inside it is built from data, which is exactly what the appjar provides.
appjars.dynamicmenu.demo.tour.menu.drawer.title=Your own layout
appjars.dynamicmenu.demo.tour.menu.drawer.desc=The header, styles and structure of the drawer belong \
  to the application. The appjar never imposes a layout on you.
appjars.dynamicmenu.demo.tour.menu.filter.title=Filtering the entries
appjars.dynamicmenu.demo.tour.menu.filter.desc=This search field is application code walking the \
  navigation items, and it shows that the menu is a normal component tree you can work with.
appjars.dynamicmenu.demo.tour.menu.nav.title=Entries built from the datastore
appjars.dynamicmenu.demo.tour.menu.nav.desc=Sections, children, icons, tooltips and links: all of it \
  comes from the menu items stored in the database, and it is filtered by the roles of the current user.
appjars.dynamicmenu.demo.tour.menu.user.title=The same menu, one per user
appjars.dynamicmenu.demo.tour.menu.user.desc=The foot of the drawer says who the menu was built for. \
  This demo ships three accounts with a role each: sign in as one and then another, and entries \
  appear and disappear without anything in the database changing. An entry whose rules reject the \
  user is left out along with its children, and a section left empty is dropped too.
appjars.dynamicmenu.demo.tour.menu.provider.title=One call in your layout
appjars.dynamicmenu.demo.tour.menu.provider.desc=To get all of this, the layout asks the appjar for \
  the menu items and adds them to its navigation component. It does so once per page load, so after \
  editing the menu you need to refresh to see the drawer change. Editing is the next tour.

appjars.dynamicmenu.demo.tour.editor.intro.title=The menu editor
appjars.dynamicmenu.demo.tour.editor.intro.desc=This screen is contributed by the appjar and \
  rendered inside your own layout. It is where the menu shown on the left is maintained.
appjars.dynamicmenu.demo.tour.editor.grid.title=The menu, as a tree
appjars.dynamicmenu.demo.tour.editor.grid.desc=Every entry with its identifier, icon, icon size and \
  label. Children are nested under their parent, and each row has actions to edit or delete it.
appjars.dynamicmenu.demo.tour.editor.new.title=Adding an entry
appjars.dynamicmenu.demo.tour.editor.new.desc=This opens the item editor, where the label, the \
  target, the icon and the permissions of an entry are set. The next tour walks through it.
appjars.dynamicmenu.demo.tour.editor.actions.title=Import, export and refresh
appjars.dynamicmenu.demo.tour.editor.actions.desc=Export writes the whole menu as JSON, and import \
  reads it back showing you a preview of which entries are new and which already exist. Refresh \
  menu reloads the page: that is what rebuilds the drawer on the left after you edit the menu.
appjars.dynamicmenu.demo.tour.editor.restrictions.title=The free-version counter
appjars.dynamicmenu.demo.tour.editor.restrictions.desc=It shows how many of the five items allowed \
  by the free version are in use. With a full license this bar is not displayed at all.
appjars.dynamicmenu.demo.tour.editor.dragdrop.title=Reordering
appjars.dynamicmenu.demo.tour.editor.dragdrop.desc=Rows can be dragged: drop one over another to \
  make it a child, or between two rows to place it there. The menu on the left follows.
appjars.dynamicmenu.demo.tour.editor.finish.title=That is the editor
appjars.dynamicmenu.demo.tour.editor.finish.desc=Try creating an entry, then use Refresh menu in \
  the actions menu to rebuild the drawer and see it appear on the left.

appjars.dynamicmenu.demo.tour.dialog.intro.title=Editing a menu item
appjars.dynamicmenu.demo.tour.dialog.intro.desc=The item editor has just been opened for you in \
  creation mode. Nothing will be saved: this is only a walk through its fields.
appjars.dynamicmenu.demo.tour.dialog.tabs.title=Two groups of settings
appjars.dynamicmenu.demo.tour.dialog.tabs.desc=Settings covers what the entry is and where it takes \
  the user; Permissions covers who gets to see it.
appjars.dynamicmenu.demo.tour.dialog.label.title=The label
appjars.dynamicmenu.demo.tour.dialog.label.desc=The text shown in the menu. Marking the entry as \
  internationalized turns this into a translation key resolved from your message files.
appjars.dynamicmenu.demo.tour.dialog.parent.title=Where it belongs
appjars.dynamicmenu.demo.tour.dialog.parent.desc=Choosing a parent nests the entry under it. Leave \
  it empty and the entry stays at the first level of the menu.
appjars.dynamicmenu.demo.tour.dialog.url.title=Where it takes the user
appjars.dynamicmenu.demo.tour.dialog.url.desc=An internal route of your application, picked from the \
  routes actually registered and with a field for each of its URL parameters, or an external address.
appjars.dynamicmenu.demo.tour.dialog.icon.title=The icon
appjars.dynamicmenu.demo.tour.dialog.icon.desc=First the family, then the icon and its size. This \
  demo offers Vaadin Icons, three FontAwesome families and an icon set of its own.
appjars.dynamicmenu.demo.tour.dialog.permissions.title=Who sees the entry
appjars.dynamicmenu.demo.tour.dialog.permissions.desc=This tab decides who the entry is displayed \
  to. The "Permissions of a menu item" tour goes through it field by field.
appjars.dynamicmenu.demo.tour.dialog.save.title=Saving
appjars.dynamicmenu.demo.tour.dialog.save.desc=Saving validates the entry and stores it. The drawer \
  on the left picks it up on the next page load, so refresh to see it. In the free version this is \
  also where the five-item limit is enforced.
appjars.dynamicmenu.demo.tour.dialog.finish.title=That is the whole editor
appjars.dynamicmenu.demo.tour.dialog.finish.desc=The dialog closes when this tour ends. Open it \
  again from the editor whenever you want to create an entry for real.

appjars.dynamicmenu.demo.tour.perm.intro.title=Permissions of a menu item
appjars.dynamicmenu.demo.tour.perm.intro.desc=The item editor has been opened on its Permissions \
  tab. Nothing will be saved: this is a walk through the rules that decide who sees an entry.
appjars.dynamicmenu.demo.tour.perm.tab.title=The Permissions tab
appjars.dynamicmenu.demo.tour.perm.tab.desc=Every entry carries its own visibility rules, evaluated \
  against the roles of the user the menu is being built for. The roles offered here are the ones this \
  application declares — in this demo, ADMIN, MANAGER and USER, one per sample account.
appjars.dynamicmenu.demo.tour.perm.onlyifallowed.title=Follow the route instead
appjars.dynamicmenu.demo.tour.perm.onlyifallowed.desc=With this on — the default for a new entry — \
  the three role fields below are ignored and disabled: what decides is whether the user may enter \
  the target route, according to the access annotation on that view. The seeded entry for the editor \
  works this way, which is why it shows up as soon as you sign in.
appjars.dynamicmenu.demo.tour.perm.all.title=Necessary permissions
appjars.dynamicmenu.demo.tour.perm.all.desc=The user must have every role listed here. Leave it \
  empty and no role is required. The seeded Audit log entry uses this with ADMIN, so only the admin \
  account sees it.
appjars.dynamicmenu.demo.tour.perm.any.title=Sufficient permissions
appjars.dynamicmenu.demo.tour.perm.any.desc=Having any one of these roles is enough for the entry \
  to be displayed. Try it with MANAGER and ADMIN on an entry pointing at the reports view.
appjars.dynamicmenu.demo.tour.perm.none.title=Not allowed permissions
appjars.dynamicmenu.demo.tour.perm.none.desc=Any user holding one of these roles will not see the \
  entry, whatever the two fields above say.
appjars.dynamicmenu.demo.tour.perm.finish.title=Hidden, not disabled
appjars.dynamicmenu.demo.tour.perm.finish.desc=An entry the rules reject is left out of the menu \
  altogether, together with its children. The roles offered here are the ones your application \
  declares, so the same editor works with whatever security setup you already have.
