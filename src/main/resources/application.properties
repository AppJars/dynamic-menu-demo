# ============================================================
# Dynamic Menu appjar
# ============================================================

# Route the menu item editor is mounted at
# Example: dm/list
com.appjars.dynamicmenu.url.views.menuitemsview=dm/list

# Default icon size, overridable per item in the editor. MEDIUM if unset.
# Possible values: SMALL, MEDIUM, LARGE
appjars.dynamicmenu.icon.size=

# ============================================================
# Datasource
# ============================================================

# H2 file database. Delete ./data to seed the sample menu again.
spring.datasource.url=jdbc:h2:./data/dynamicmenudb;FILE_LOCK=NO
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Web console to inspect the menu table, at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# ============================================================
# JPA / Hibernate
# ============================================================

# Let Hibernate create and update the menu tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

# Set to true to see the statements the appjar runs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# The menu is a tree: one merge can reach the same entity twice
spring.jpa.properties.hibernate.event.merge.entity_copy_observer=allow

spring.jpa.open-in-view=false

# ============================================================
# Vaadin
# ============================================================

# Packages scanned for Vaadin components and routes
vaadin.allowed-packages=com.vaadin,org.vaadin,dev.hilla,com.appjars,com.flowingcode

# Resolves the message keys of both the appjar and this demo
vaadin.i18n.provider=com.appjars.utils.i18n.DefaultI18nProvider

# Uncomment to open the default browser when the application starts
#vaadin.launch-browser=true
